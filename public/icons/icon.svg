<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#FAF3E7"/>
  <!-- hard offset shadow -->
  <rect x="126" y="130" width="280" height="280" rx="50" fill="#141414"/>
  <!-- coral block -->
  <rect x="106" y="110" width="280" height="280" rx="50" fill="#F26D6D" stroke="#141414" stroke-width="14"/>
  <!-- tally: four uprights and a cross stroke with equal overshoot on both ends -->
