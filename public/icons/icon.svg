    <line x1="180" y1="176" x2="180" y2="324"/>
    <line x1="224" y1="176" x2="224" y2="324"/>
    <line x1="268" y1="176" x2="268" y2="324"/>
    <line x1="312" y1="176" x2="312" y2="324"/>
    <line x1="162" y1="312" x2="330" y2="188"/>
  </g>
  <!-- yellow star sticker, fully inside the canvas -->
  <path d="M0 -50 L14 -18 L48 -14 L22 8 L30 42 L0 24 L-30 42 L-22 8 L-48 -14 L-14 -18 Z" transform="translate(392 112) rotate(10)" fill="#F8DE5A" stroke="#141414" stroke-width="11" stroke-linejoin="round"/>
