<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>QadaOS hero</title>
    <style>
      @font-face {
        font-family: "Archivo";
        src: url("archivo-latin.woff2") format("woff2");
        font-weight: 100 900;
      }
      :root {
        --cream: #faf3e7;
        --paper: #fffdf8;
        --ink: #141414;
        --coral: #f26d6d;
        --violet: #a98be8;
        --teal: #5fc9b6;
        --yellow: #f8de5a;
        --sky: #7ac3e6;
        --mute: #5f594f;
      }
      * { box-sizing: border-box; margin: 0; }
      body {
        width: 1600px;
        height: 840px;
        overflow: hidden;
        font-family: "Archivo", sans-serif;
        color: var(--ink);
        background-color: var(--cream);
        background-image: radial-gradient(#d6cfc2 2.2px, transparent 2.6px), radial-gradient(#d6cfc2 2.2px, transparent 2.6px);
        background-size: 34px 34px;
        background-position: 0 0, 17px 17px;
      }
      .left { position: absolute; left: 84px; top: 150px; width: 640px; }
      .mark {
        position: relative;
        display: inline-block;
        padding: 6px 34px 16px;
        border: 5px solid var(--ink);
        border-radius: 30px;
        background: var(--coral);
        box-shadow: 12px 12px 0 var(--ink);
        font-size: 124px;
        font-weight: 900;
        letter-spacing: -0.045em;
        line-height: 1;
      }
      .star { position: absolute; right: -52px; top: -58px; width: 112px; height: 112px; }
      h1 { margin-top: 58px; font-size: 50px; font-weight: 900; letter-spacing: -0.03em; line-height: 1.05; }
      .squiggle { display: block; margin-top: 18px; width: 210px; height: 24px; }
      p { margin-top: 20px; max-width: 560px; font-size: 25px; font-weight: 600; line-height: 1.38; color: var(--mute); }
      .chips { display: flex; gap: 12px; margin-top: 34px; }
      .chips span {
        padding: 9px 18px;
        border: 4px solid var(--ink);
        border-radius: 999px;
        box-shadow: 4px 4px 0 var(--ink);
        font-size: 20px;
        font-weight: 800;
        white-space: nowrap;
      }
      .phone {
        position: absolute;
        width: 268px;
        height: 580px;
        overflow: hidden;
        border: 5px solid var(--ink);
        border-radius: 40px;
        background: var(--cream);
        box-shadow: 12px 12px 0 var(--ink);
      }
      .phone img { display: block; width: 100%; }
      .p1 { left: 790px; top: 170px; transform: rotate(-5deg); }
      .p2 { left: 1030px; top: 96px; z-index: 2; }
      .p3 { left: 1270px; top: 170px; transform: rotate(5deg); }
      .dot { position: absolute; border: 5px solid var(--ink); border-radius: 50%; }
      .tag {
        position: absolute;
        z-index: 3;
        padding: 8px 16px;
        border: 4px solid var(--ink);
        border-radius: 14px;
        box-shadow: 5px 5px 0 var(--ink);
        font-size: 19px;
        font-weight: 900;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="left">
      <div class="mark">
        QadaOS
        <svg class="star" viewBox="-60 -60 120 120"><path d="M0 -50 L14 -18 L48 -14 L22 8 L30 42 L0 24 L-30 42 L-22 8 L-48 -14 L-14 -18 Z" transform="rotate(10)" fill="#F8DE5A" stroke="#141414" stroke-width="7" stroke-linejoin="round" /></svg>
      </div>
      <h1>One honest ledger for the prayers you owe.</h1>
      <svg class="squiggle" viewBox="0 0 210 24" fill="none" stroke="#141414" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16 Q 21 -4 38 12 T 72 12 T 106 12 T 140 12 T 174 12 T 206 10" /></svg>
      <p>Record today's prayers in a tap. Make up the missed ones on a plan that fits your life, and watch the number fall.</p>
      <div class="chips">
        <span style="background: var(--teal)">Works offline</span>
        <span style="background: var(--yellow)">No streaks, no guilt</span>
        <span style="background: var(--paper)">Open source</span>
      </div>
    </div>

    <div class="phone p1"><img src="../shots/plan.png" alt="" /></div>
    <div class="phone p2"><img src="../shots/today.png" alt="" /></div>
    <div class="phone p3"><img src="../shots/stats.png" alt="" /></div>

    <div class="tag" style="left: 940px; top: 64px; background: var(--yellow); transform: rotate(-6deg)">19,526 to go</div>
    <div class="tag" style="left: 1352px; top: 712px; background: var(--sky); transform: rotate(4deg)">Finish: Nov 2037</div>
    <div class="dot" style="left: 748px; top: 690px; width: 46px; height: 46px; background: var(--violet)"></div>
    <div class="dot" style="left: 1520px; top: 70px; width: 30px; height: 30px; background: var(--coral)"></div>
  </body>
</html>
